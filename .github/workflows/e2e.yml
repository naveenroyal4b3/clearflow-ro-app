name: End-to-end tests

# Runs the Playwright tests against a throwaway local Supabase stack (never the production project).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Start local Supabase
        run: npm run e2e:prepare

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
