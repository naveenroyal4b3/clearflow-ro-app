name: Database backup

# Nightly encrypted backup of the production database. The repository is public, so the dump is
# encrypted with BACKUP_PASSPHRASE before it is stored as an artifact; without the passphrase
# the file is unreadable. Each backup is then test-restored into a throwaway local Supabase stack,
# so a backup that cannot be restored fails the run. Restore steps are in SUPABASE_SETUP.md.
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check backup secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets to enable backups."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out source
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PostgreSQL 17 client
        if: steps.secrets.outputs.ready == 'true'
        # pg_dump must be at least the server's version (Supabase runs Postgres 17).
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Dump database
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" --schema=public --schema-only --no-owner -f backup/schema.sql
          pg_dump "$SUPABASE_DB_URL" --schema=public --data-only --no-owner -f backup/data.sql
          pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --table=auth.users --table=auth.identities -f backup/auth-data.sql
          ls -la backup

      - name: Encrypt backup
        if: steps.secrets.outputs.ready == 'true'
        run: |
          name="clearflow-backup-$(date -u +%Y-%m-%dT%H%MZ)"
          tar -czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm "$name.tar.gz"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - name: Store encrypted backup
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test-restore backup
        # Runs after the backup is stored, so a restore problem never loses that night's backup.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          supabase="npx --yes supabase@2.122.0 --workdir $RUNNER_TEMP/restore-test"
          mkdir -p "$RUNNER_TEMP/restore-test"
          # Keep outgoing connections off the ports the local Supabase stack needs (54321-54329).
          sudo sysctl -w net.ipv4.ip_local_port_range="55000 65000"
          $supabase init
          $supabase start -x vector,imgproxy,logflare,supavisor,postgres-meta,studio,realtime,storage-api,edge-runtime
          bash scripts/verify-backup-restore.sh backup "postgresql://postgres:postgres@127.0.0.1:54322/postgres"

      - name: Remove unencrypted dump
        if: always()
        run: rm -rf backup
