name: Database backup

# Nightly encrypted backup of the production database. The repository is public, so the dump is
# encrypted with BACKUP_PASSPHRASE before it is stored as an artifact; without the passphrase
# the file is unreadable. Restore steps are in SUPABASE_SETUP.md.
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check backup secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets to enable backups."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 17 client
        if: steps.secrets.outputs.ready == 'true'
        # pg_dump must be at least the server's version (Supabase runs Postgres 17).
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        if: steps.secrets.outputs.ready == 'true'
        run: |
          mkdir -p backup
          pg_dump=/usr/lib/postgresql/17/bin/pg_dump
          $pg_dump "$SUPABASE_DB_URL" --schema=public --schema-only --no-owner -f backup/schema.sql
          $pg_dump "$SUPABASE_DB_URL" --schema=public --data-only --no-owner -f backup/data.sql
          $pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --table=auth.users --table=auth.identities -f backup/auth-data.sql
          ls -la backup

      - name: Encrypt backup
        if: steps.secrets.outputs.ready == 'true'
        run: |
          name="clearflow-backup-$(date -u +%Y-%m-%dT%H%MZ)"
          tar -czf "$name.tar.gz" backup
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" "$name.tar.gz"
          rm -rf backup "$name.tar.gz"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"

      - name: Store encrypted backup
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_NAME }}
          path: ${{ env.BACKUP_NAME }}.tar.gz.gpg
          if-no-files-found: error
          retention-days: 30
