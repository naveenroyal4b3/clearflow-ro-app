name: Build Android release

# Builds the signed app bundle (.aab) for Google Play from the React Native app in mobile/.
# It runs by itself after CI passes on main when a merge changed the app (mobile/ or the shared
# code in src/), and uploads to the internal testing track. It can also be run from the Actions
# tab. It only builds a commit that already passed CI, needs no approval, and publishes a GitHub
# release with the bundle, an SBOM and a build provenance attestation. With the PLAY_SERVICE_ACCOUNT_JSON
# secret set, it also uploads the bundle to Google Play (the internal testing track by default) and
# sends it for review.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      play_track:
        description: Play testing track to upload to (alpha is Play's closed testing track)
        type: choice
        options: [alpha, internal]
        default: internal
      play_status:
        description: completed sends the release for review and rolls it out; draft leaves it for you to publish in Play Console
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

# One release at a time; a merge made during a build waits for it instead of cancelling it.
concurrency:
  group: android-release
  cancel-in-progress: false

env:
  # After CI, build the commit CI tested; when run by hand, the commit it was started on.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  PLAY_TRACK: ${{ inputs.play_track || 'internal' }}
  PLAY_STATUS: ${{ inputs.play_status || 'completed' }}

jobs:
  verify-ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Require a main commit that passed CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            # Only merges to main whose CI passed, and only when the app itself changed.
            if [ "$RUN_EVENT" != "push" ] || [ "$RUN_CONCLUSION" != "success" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            changed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.files[].filename')
            if echo "$changed" | grep -qE '^(mobile/|src/(gst|supabase-data|documents|i18n).js$|src/locales/|.github/workflows/android-release.yml$)'; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "No app changes in $SHA; skipping the release."
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are built from main only."
            exit 1
          fi
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
          if [ "$passed" = "0" ]; then
            echo "::error::CI has not passed on $SHA yet. Wait for the CI workflow to finish, then run this again."
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  release-aab:
    needs: verify-ci
    if: needs.verify-ci.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create the tag and GitHub release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
      # Google Play needs a higher versionCode for every upload, so use this workflow's run number.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      AAB: mobile/android/app/build/outputs/bundle/release/app-release.aab
      # R8's mapping file, so crash reports in Play Console show readable names.
      MAPPING: mobile/android/app/build/outputs/mapping/release/mapping.txt
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        id: secrets
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets first."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "play=$([ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install dependencies and generate the native Android project
        working-directory: mobile
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          grep -E "versionCode|versionName" android/app/build.gradle
          version_name=$(node -p "require('./package.json').version")
          echo "TAG=v$version_name-build${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build signed app bundle
        # Signed with the same upload key as the earlier Capacitor builds, so Google Play accepts
        # it as an update to the same app.
        working-directory: mobile/android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Verify signature
        run: jarsigner -verify "$AAB" | tail -1

      - name: Generate SBOM
        # Lists every package shipped in the app, so a vulnerable dependency can be traced to a release.
        working-directory: mobile
        run: npm sbom --omit=dev --sbom-format=spdx > ../sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.AAB }}

      - name: Upload app bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clearflow-release-aab-${{ github.run_number }}
          path: |
            ${{ env.AAB }}
            ${{ env.MAPPING }}
            sbom.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$AAB" "clearflow-$TAG.aab"
          gh release create "$TAG" "clearflow-$TAG.aab" sbom.spdx.json \
            --target "$SHA" --title "$TAG" --generate-notes

      - name: Upload to Google Play
        if: steps.secrets.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.naveenroyal4b3.clearflow
          releaseFiles: ${{ env.AAB }}
          mappingFile: ${{ env.MAPPING }}
          tracks: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}
