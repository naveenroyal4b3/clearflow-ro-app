<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Clearflow | RO Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="auth-root"></div>
  <div class="app" id="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5S5.7 10.1 5.7 14.5a6.3 6.3 0 0 0 12.6 0C18.3 10.1 12 3.5 12 3.5Z"/><path d="M9 15.2a3.1 3.1 0 0 0 3.1 3.1"/></svg></div>
        <div><div class="brand-name">clearflow</div><div class="brand-caption">WATER SYSTEMS · OPERATIONS</div></div>
      </div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg>Overview</button>
        <button class="nav-item" data-view="customers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="9" cy="8" r="3.5"/><path d="M3 20v-1.6a5.2 5.2 0 0 1 5.2-5.2h1.6a5.2 5.2 0 0 1 5.2 5.2V20M16 4.8a3.5 3.5 0 0 1 0 6.7M18 13.4a5.2 5.2 0 0 1 3 4.8V20"/></svg>Customers<span class="nav-count" id="customer-count">0</span></button>
        <button class="nav-item" data-view="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 6 18 2l4 4-4 4M20 8l-8.5 8.5M13 5l6 6M5 8l4-4 4 4-4 4M3 20l5-5 4 4-5 5H3z"/></svg>Service jobs<span class="nav-count" id="jobs-count">0</span></button>
        <button class="nav-item" data-view="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21zM8 8h8M8 12h8M8 16h4"/></svg>Sales & invoices</button>
        <button class="nav-item" data-view="catalog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 7.5 12 3l8 4.5-8 4.5zM4 12l8 4.5 8-4.5M4 16.5 12 21l8-4.5"/></svg>Product catalogue</button>
        <button class="nav-item" data-view="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="8" r="3.5"/><path d="M4 21v-1a8 8 0 0 1 16 0v1M18 4l1.5-1.5L22 5l-3 3"/></svg>Accounts & access</button>
        <button class="nav-item" data-view="feedback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2v-6a7.5 7.5 0 1 1 17-3.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>Feedback</button>
        <button class="nav-item nav-more" data-action="more-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</button>
      </nav>
      <div class="side-bottom">
        <div class="water-card"><strong>Every drop, accounted for.</strong><span>Sales, service and stock in one place.</span></div>
        <button class="user-chip" type="button" data-action="my-account" title="My account"><div class="avatar" id="user-initials">NK</div><div><div class="user-name" id="user-name">Naveen Kumar</div><div class="user-role" id="user-role">Business owner</div></div></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb"><span>Clearflow</span><span>›</span><strong id="crumb-title">Overview</strong></div>
        <div class="top-actions">
          <div class="role-control" id="role-control"><label for="role-select">Preview</label><select id="role-select" aria-label="Preview price list"><option value="customer">Customer prices</option><option value="technician">Technician prices</option><option value="shop">Shop prices</option></select></div>
          <button class="icon-button" id="help-button" aria-label="Help" title="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1-1.9 1.4-1.9 3M12 17.5v.1"/></svg></button>
          <button class="button secondary" id="signout-button" type="button" hidden>Sign out</button>
        </div>
      </header>
      <section class="page" id="page"></section>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
