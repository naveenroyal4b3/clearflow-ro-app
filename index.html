<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <title>Clearflow | RO Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #1c2927;
      --muted: #788480;
      --line: #e8ece8;
      --paper: #fff;
      --canvas: #f5f7f4;
      --teal: #197c70;
      --teal-dark: #12594f;
      --teal-pale: #e3f2ed;
      --lime: #d7ed76;
      --blue: #4775a8;
      --blue-pale: #eaf1f8;
      --orange: #bc7742;
      --orange-pale: #fbefe4;
      --red: #b94a48;
      --red-pale: #fae9e7;
      --shadow: 0 12px 32px rgba(27, 49, 42, .055);
      font-family: "DM Sans", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    .auth-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 15% 15%, #e8f4ec, transparent 38%), var(--canvas); }
    .auth-card { width: min(100%, 440px); padding: 30px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); box-shadow: var(--shadow); }
    .auth-card h1 { margin-top: 26px; font-size: 24px; }
    .auth-card > p { margin: 8px 0 22px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .auth-brand { display: flex; align-items: center; gap: 10px; }
    .auth-brand .brand-mark { flex: none; }
    .auth-form { display: grid; gap: 13px; }
    .auth-form .button { width: 100%; margin-top: 4px; }
    .auth-message { margin: 0 0 14px; padding: 11px 12px; border: 1px solid #dfece4; border-radius: 6px; color: #355a4d; background: #f0f7f1; font-size: 12px; line-height: 1.5; }
    .auth-switch { display: block; width: 100%; margin-top: 16px; border: 0; color: var(--teal); background: transparent; font-size: 12px; font-weight: 700; }
    .auth-footnote { margin-top: 18px !important; color: #98a29c !important; font-size: 11px !important; }
    .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
    .sidebar { position: sticky; top: 0; display: flex; flex-direction: column; height: 100vh; padding: 27px 17px 18px; background: #fff; border-right: 1px solid var(--line); z-index: 4; }
    .brand { display: flex; gap: 11px; align-items: center; padding: 0 12px; margin-bottom: 42px; }
    .brand-mark { width: 35px; height: 35px; display: grid; place-items: center; border-radius: 12px 12px 12px 4px; background: var(--teal); color: white; }
    .brand-mark svg { width: 21px; height: 21px; }
    .brand-name { font: 800 17px/1 "Manrope", sans-serif; letter-spacing: 0; }
    .brand-caption { margin-top: 5px; font-size: 10px; color: var(--muted); letter-spacing: 0; }
    .nav-label { padding: 0 13px 10px; color: #a0aaa6; font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav-item { width: 100%; height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 13px; border: 0; border-radius: 8px; color: #64716c; background: transparent; text-align: left; font-size: 13px; font-weight: 600; }
    .nav-item:hover { background: #f6f8f6; color: var(--ink); }
    .nav-item.active { color: var(--teal-dark); background: var(--teal-pale); }
    .nav-item svg { width: 18px; height: 18px; stroke-width: 1.8; flex: none; }
    .nav-more { display: none; }
    .nav-count { margin-left: auto; min-width: 21px; padding: 3px 6px; border-radius: 12px; background: #edf1ed; color: #6f7a76; font-size: 10px; text-align: center; }
    .side-bottom { margin-top: auto; }
    .water-card { position: relative; overflow: hidden; margin: 10px 4px 18px; padding: 16px; border-radius: 8px; background: #e9f4ed; }
    .water-card:after { content: ""; position: absolute; width: 70px; height: 70px; right: -22px; bottom: -27px; border: 1px solid rgba(25,124,112,.18); border-radius: 50%; box-shadow: 0 0 0 10px rgba(25,124,112,.04), 0 0 0 22px rgba(25,124,112,.035); }
    .water-card strong { display: block; font: 700 12px "Manrope", sans-serif; }
    .water-card span { display: block; margin-top: 5px; color: #72817a; font-size: 10px; }
    .user-chip { display: flex; align-items: center; gap: 10px; padding: 12px 10px 0; border-top: 1px solid var(--line); }
    button.user-chip { width: 100%; border-width: 1px 0 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .button.danger { border-color: #b42318; background: #b42318; color: #fff; }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #dcece4; color: var(--teal-dark); font-size: 11px; font-weight: 700; }
    .user-name { font-size: 12px; font-weight: 700; }
    .user-role { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .main { min-width: 0; }
    .topbar { height: 76px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(20px, 4vw, 56px); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.72); }
    .crumb { display: flex; align-items: center; gap: 8px; color: #96a09b; font-size: 11px; }
    .crumb strong { color: #4a5752; font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .role-control { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: white; }
    .role-control label { color: var(--muted); font-size: 10px; }
    .role-control select { max-width: 125px; border: 0; outline: 0; color: var(--ink); background: transparent; font-size: 11px; font-weight: 700; }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; color: #61706a; background: white; }
    .icon-button svg { width: 17px; height: 17px; }
    .page { width: min(100%, 1440px); margin: 0 auto; padding: 34px clamp(20px, 4vw, 56px) 60px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 26px; }
    .eyebrow { margin-bottom: 8px; color: var(--teal); font-size: 10px; font-weight: 700; letter-spacing: 0; text-transform: uppercase; }
    h1 { margin: 0; font: 700 28px/1.2 "Manrope", sans-serif; letter-spacing: 0; }
    .subhead { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 15px; border: 1px solid transparent; border-radius: 6px; color: #fff; background: var(--teal); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .button:hover { background: var(--teal-dark); }
    .button.secondary { color: #40534c; border-color: var(--line); background: white; }
    .button.secondary:hover { background: #f7f9f7; }
    .button svg { width: 15px; height: 15px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 19px; }
    .metric { min-height: 112px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
    .metric-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 10px; font-weight: 600; }
    .metric-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: var(--teal); background: var(--teal-pale); }
    .metric-icon svg { width: 15px; height: 15px; }
    .metric-value { margin-top: 10px; font: 700 23px/1 "Manrope", sans-serif; letter-spacing: 0; }
    .metric-note { margin-top: 8px; color: #97a19d; font-size: 10px; }
    .metric-note b { color: var(--teal); font-weight: 700; }
    .setup-panel { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 0 0 18px; padding: 20px 22px; border: 1px solid #dfece4; border-radius: 8px; background: #edf6ef; }
    .setup-copy h2 { margin: 0; font: 700 18px/1.3 "Manrope", sans-serif; }
    .setup-copy p { margin: 6px 0 0; color: #64746b; font-size: 13px; }
    .setup-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .dash-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(280px, .85fr); gap: 16px; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 17px 19px; border-bottom: 1px solid #eef0ed; }
    .panel-title { font: 700 13px "Manrope", sans-serif; }
    .panel-note { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .text-link { padding: 4px 0; border: 0; color: var(--teal); background: transparent; font-size: 10px; font-weight: 700; }
    .chart-wrap { padding: 18px 19px 14px; }
    .chart-summary { display: flex; align-items: baseline; gap: 9px; }
    .chart-summary strong { font: 700 24px "Manrope", sans-serif; }
    .chart-summary span { color: var(--teal); font-size: 10px; font-weight: 700; }
    .chart { height: 157px; display: flex; align-items: flex-end; justify-content: space-between; gap: 9px; padding: 22px 4px 0; }
    .bar-group { height: 100%; display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; }
    .bar { width: min(100%, 30px); min-height: 3px; border-radius: 4px 4px 1px 1px; background: #c9e6d9; transition: height .25s ease; }
    .bar.current { background: var(--teal); }
    .bar-label { color: #99a29e; font-size: 9px; }
    .chart-legend { display: flex; align-items: center; gap: 6px; margin-top: 7px; color: #86918b; font-size: 9px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); }
    .job-list { padding: 4px 18px 8px; }
    .job-row { display: flex; align-items: center; gap: 11px; padding: 13px 0; border-bottom: 1px solid #f0f2ef; }
    .job-row:last-child { border-bottom: 0; }
    .job-symbol { width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: 8px; color: var(--blue); background: var(--blue-pale); }
    .job-symbol svg { width: 16px; height: 16px; }
    .job-copy { min-width: 0; flex: 1; }
    .job-copy strong { display: block; overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .job-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 9px; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 20px; color: #59776a; background: #edf5f0; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .status:before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #62a380; }
    .status.scheduled, .status.sent { color: #9c6a37; background: #fbf2e7; }
    .status.scheduled:before, .status.sent:before { background: #d99a54; }
    .status.overdue, .status.cancelled { color: var(--red); background: var(--red-pale); }
    .status.overdue:before, .status.cancelled:before { background: var(--red); }
    .status.urgent, .status.high { color: var(--red); background: var(--red-pale); }
    .status.urgent:before, .status.high:before { background: var(--red); }
    .lower-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, .85fr); gap: 16px; margin-top: 16px; }
    .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px 18px 18px; }
    .quick-action { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 13px 10px; border: 1px solid var(--line); border-radius: 7px; color: #4c5c55; background: white; text-align: left; }
    .quick-action:hover { border-color: #b5d7ca; background: #f8fbf8; }
    .quick-action svg { width: 17px; height: 17px; color: var(--teal); }
    .quick-action span { font-size: 10px; font-weight: 600; }
    .feed { padding: 7px 18px 10px; }
    .feed-line { display: flex; gap: 10px; padding: 10px 0; }
    .feed-dot { width: 7px; height: 7px; margin-top: 4px; flex: none; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 3px #f4f8e5; }
    .feed-text { color: #6e7c75; font-size: 10px; line-height: 1.5; }
    .feed-text strong { color: #40504a; font-weight: 700; }
    .feed-time { display: block; margin-top: 3px; color: #a2aaa6; font-size: 9px; }
    .toolbar { display: flex; align-items: center; gap: 9px; margin-bottom: 15px; }
    .search { position: relative; flex: 1; max-width: 340px; }
    .search svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: #98a39d; }
    .search input { width: 100%; height: 44px; padding: 0 12px 0 34px; border: 1px solid var(--line); border-radius: 6px; outline: 0; background: #fff; font-size: 14px; }
    .search input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: #81b9a3; box-shadow: 0 0 0 3px rgba(25,124,112,.08); }
    .filter-select { min-height: 44px; padding: 0 28px 0 10px; border: 1px solid var(--line); border-radius: 6px; color: #5f6e67; background: white; font-size: 12px; }
    .table-panel { overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap; }
    th { padding: 12px 16px; color: #929d97; background: #fbfcfb; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0; }
    td { padding: 14px 16px; border-top: 1px solid #eef0ed; color: #5a6862; font-size: 10px; }
    td strong { color: #364640; font-size: 10px; font-weight: 700; }
    .person-cell { display: flex; align-items: center; gap: 9px; }
    .mini-avatar { width: 29px; height: 29px; display: grid; place-items: center; border-radius: 50%; color: #477166; background: #e9f1eb; font-size: 9px; font-weight: 700; }
    .muted-cell { margin-top: 3px; color: #9aa39e; font-size: 9px; }
    .row-action { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 5px; color: #78847e; background: transparent; }
    .row-action:hover { background: #f1f5f1; }
    .row-action svg { width: 15px; height: 15px; }
    .empty { padding: 38px 20px; color: #89948e; text-align: center; font-size: 11px; }
    .tabs { display: flex; gap: 19px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .tab { position: relative; padding: 14px 0; border: 0; color: #849089; background: transparent; font-size: 10px; font-weight: 700; }
    .tab.active { color: var(--teal); }
    .tab.active:after { content: ""; position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; background: var(--teal); }
    .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .product { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .product-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 14px 10px; }
    .product-art { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 8px; color: var(--teal); background: #e9f4ed; }
    .product-art.blue { color: #567da4; background: #edf2f7; }
    .product-art.gold { color: #aa7a43; background: #f8f0e5; }
    .product-art svg { width: 24px; height: 24px; }
    .category { padding: 5px 7px; border-radius: 4px; color: #718078; background: #f2f5f2; font-size: 8px; font-weight: 700; }
    .product-info { padding: 3px 14px 14px; }
    .product-info h3 { margin: 0; font: 700 12px "Manrope", sans-serif; }
    .product-info p { min-height: 28px; margin: 5px 0 12px; color: #909b95; font-size: 9px; line-height: 1.5; }
    .product-price { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid #eef0ed; }
    .product-price strong { font: 700 15px "Manrope", sans-serif; }
    .product-price span { color: #9ba49f; font-size: 8px; }
    .price-other { display: flex; gap: 10px; margin-top: 9px; color: #7e8b84; font-size: 8px; }
    .price-other b { color: #52635b; }
    .job-customer { font-weight: 700; color: #40504a; }
    .call-link { color: var(--teal); text-decoration: none; }
    .role-tag { display: inline-flex; padding: 5px 7px; border-radius: 4px; color: #57766a; background: #eaf3ed; font-size: 8px; font-weight: 700; }
    .notice { margin-bottom: 15px; padding: 11px 13px; border: 1px solid #dfece4; border-radius: 6px; color: #63776c; background: #f0f7f1; font-size: 10px; }
    .notice strong { color: #335c4c; }
    .overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(20,35,30,.38); }
    .modal { width: min(100%, 520px); max-height: min(90vh, 780px); overflow: auto; border-radius: 9px; background: #fff; box-shadow: 0 24px 80px rgba(17,35,27,.2); }
    .modal.wide { width: min(100%, 680px); }
    .modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; padding: 20px 22px 16px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font: 700 17px "Manrope", sans-serif; }
    .modal-head p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    .modal-body { padding: 18px 22px 22px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .field { display: flex; min-width: 0; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #62716a; font-size: 10px; font-weight: 700; }
    .field input, .field select, .field textarea { width: 100%; min-height: 44px; padding: 9px 11px; border: 1px solid #e3e8e3; border-radius: 5px; outline: 0; color: #33423c; background: white; font-size: 14px; }
    .field textarea { min-height: 70px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .price-toggle { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; color: #5d6c65; font-size: 10px; }
    .price-toggle input { accent-color: var(--teal); }
    .line-item { display: grid; grid-template-columns: minmax(0, 1fr) 70px 95px 28px; align-items: end; gap: 8px; margin-bottom: 9px; }
    .line-item .field { gap: 4px; }
    .line-item .field label { font-size: 9px; }
    .line-item .field input, .line-item .field select { min-height: 34px; padding: 6px 7px; font-size: 10px; }
    .invoice-total { display: grid; gap: 7px; width: 240px; margin: 16px 0 0 auto; padding-top: 12px; border-top: 1px solid var(--line); color: #7a8780; font-size: 10px; }
    .invoice-total div { display: flex; justify-content: space-between; }
    .invoice-total .grand { padding-top: 8px; border-top: 1px solid var(--line); color: var(--ink); font-size: 13px; font-weight: 700; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 40; padding: 12px 16px; border-radius: 7px; color: #fff; background: #234f43; box-shadow: var(--shadow); font-size: 11px; animation: toast-in .2s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .hide { display: none !important; }
    :focus-visible { outline: 3px solid rgba(25,124,112,.35); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
    @media (max-width: 1050px) {
      .app { grid-template-columns: 210px minmax(0, 1fr); }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .app { display: block; padding-bottom: 69px; }
      .sidebar { position: fixed; inset: auto 0 0; width: 100%; height: 65px; padding: 5px 8px max(5px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); border-right: 0; background: rgba(255,255,255,.97); }
      .brand, .nav-label, .side-bottom { display: none; }
      .nav { height: 100%; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; overflow: hidden; }
      .nav-item { height: 54px; flex-direction: column; justify-content: center; gap: 3px; padding: 3px 2px; border-radius: 6px; font-size: 10px; }
      .nav-item[data-view="catalog"], .nav-item[data-view="accounts"], .nav-item[data-view="feedback"] { display: none; }
      .nav-more { display: flex; }
      .nav-item svg { width: 17px; height: 17px; }
      .nav-count { display: none; }
      .topbar { height: 59px; padding: 0 17px; }
      .crumb { font-size: 10px; }
      .role-control { gap: 5px; padding: 6px 7px; }
      .role-control label { display: none; }
      .role-control select { max-width: 94px; font-size: 10px; }
      .top-actions { gap: 7px; }
      .icon-button { width: 40px; height: 40px; }
      .page { padding: 25px 16px 35px; }
      .page-head { align-items: flex-start; margin-bottom: 18px; }
      h1 { font-size: 24px; }
      .subhead { max-width: 250px; line-height: 1.5; }
      .page-head .button { min-height: 44px; padding: 0 11px; font-size: 12px; }
      .metrics { gap: 8px; margin-bottom: 12px; }
      .metric { min-height: 100px; padding: 13px; }
      .metric-value { font-size: 20px; }
      .setup-panel { align-items: flex-start; flex-direction: column; padding: 17px; }
      .setup-actions { width: 100%; }
      .setup-actions .button { flex: 1; }
      .dash-grid, .lower-grid { grid-template-columns: 1fr; gap: 12px; }
      .lower-grid { margin-top: 12px; }
      .chart { height: 140px; }
      .quick-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 12px; }
      .quick-action { min-height: 72px; padding: 10px 7px; }
      .quick-action span { font-size: 9px; }
      .toolbar { flex-wrap: wrap; }
      .toolbar .search { flex-basis: 100%; max-width: none; }
      .toolbar .button { margin-left: auto; }
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .product-top { padding: 10px 10px 7px; }
      .product-info { padding: 3px 10px 11px; }
      .product-info h3 { font-size: 12px; }
      .product-info p { min-height: 38px; font-size: 11px; }
      .product-price strong { font-size: 13px; }
      .price-other { gap: 5px; font-size: 7px; }
      .table-panel { border-radius: 7px; }
      .table-scroll { margin: 0 -1px; }
      .table-panel table { min-width: 650px; }
      .form-grid { gap: 10px; }
      .overlay { align-items: end; padding: 0; }
      .modal, .modal.wide { width: 100%; max-height: 92vh; border-radius: 12px 12px 0 0; }
      .modal-head { padding: 17px 17px 13px; }
      .modal-body { padding: 15px 17px max(20px, env(safe-area-inset-bottom)); }
    }
    @media (max-width: 390px) {
      .role-control select { max-width: 78px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric-top { font-size: 9px; }
      .quick-grid { gap: 5px; }
      .quick-action span { font-size: 10px; }
      .line-item { grid-template-columns: minmax(0, 1fr) 48px 75px 25px; gap: 5px; }
    }
  </style>
</head>
<body>
  <div id="auth-root"></div>
  <div class="app" id="app-shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3.5S5.7 10.1 5.7 14.5a6.3 6.3 0 0 0 12.6 0C18.3 10.1 12 3.5 12 3.5Z"/><path d="M9 15.2a3.1 3.1 0 0 0 3.1 3.1"/></svg></div>
        <div><div class="brand-name">clearflow</div><div class="brand-caption">WATER SYSTEMS · OPERATIONS</div></div>

        <button class="nav-item" data-view="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 6 18 2l4 4-4 4M20 8l-8.5 8.5M13 5l6 6M5 8l4-4 4 4-4 4M3 20l5-5 4 4-5 5H3z"/></svg>Service jobs<span class="nav-count" id="jobs-count">0</span></button>
        <button class="nav-item" data-view="sales"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21zM8 8h8M8 12h8M8 16h4"/></svg>Sales & invoices</button>

        <button class="nav-item nav-more" data-action="more-menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More</button>
      </nav>
      <div class="side-bottom">
        <div class="water-card"><strong>Every drop, accounted for.</strong><span>Sales, service and stock in one place.</span></div>
        <button class="user-chip" type="button" data-action="my-account" title="My account"><div class="avatar" id="user-initials">NK</div><div><div class="user-name" id="user-name">Naveen Kumar</div><div class="user-role" id="user-role">Business owner</div></div></button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb"><span>Clearflow</span><span>›</span><strong id="crumb-title">Overview</strong></div>
        <div class="top-actions">
          <div class="role-control" id="role-control"><label for="role-select">Preview</label><select id="role-select" aria-label="Preview price list"><option value="customer">Customer prices</option><option value="technician">Technician prices</option><option value="shop">Shop prices</option></select></div>
          <button class="icon-button" id="help-button" aria-label="Help" title="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1-1.9 1.4-1.9 3M12 17.5v.1"/></svg></button>

      <section class="page" id="page"></section>

  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    import { createSalesDocument, deleteAccount, inviteMember, loadWorkspace, saveWorkspaceRecords, setFeedbackStatus } from './src/supabase-data.js';

    const icons = {
      person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg>',
      service: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 6 18 2l4 4-4 4M20 8l-8.5 8.5M13 5l6 6M5 8l4-4 4 4-4 4M3 20l5-5 4 4-5 5H3z"/></svg>',
      invoice: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21zM8 8h8M8 12h8M8 16h4"/></svg>',
      product: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7.5 12 3l8 4.5-8 4.5zM4 12l8 4.5 8-4.5M4 16.5 12 21l8-4.5"/></svg>',
      search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>',
      plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
      calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
      close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 6 12 12M18 6 6 18"/></svg>',
      download: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m-5-5 5 5 5-5M4 19v2h16v-2"/></svg>'
    };
    const roleLabels = { owner: 'Owner', technician: 'Technician', shop: 'Shop', customer: 'Customer' };
    const emptyData = { customers: [], jobs: [], products: [], accounts: [], documents: [], feedback: [] };
    const environment = import.meta.env;
    const supabaseUrl = environment.VITE_SUPABASE_URL || '';
    const supabaseAnonKey = environment.VITE_SUPABASE_ANON_KEY || '';
    // Read invite/recovery link details before the Supabase client consumes and clears the URL hash.
    const authLinkParams = new URLSearchParams(window.location.hash.slice(1));
    const authLinkType = authLinkParams.get('type');
    const authLinkError = authLinkParams.get('error_description');
    // The public delete-account page links here so people can delete their account from the web.
    let deleteAccountRequested = new URLSearchParams(window.location.search).get('action') === 'delete-account';
    const supabaseClient = supabaseUrl && supabaseAnonKey ? createClient(supabaseUrl, supabaseAnonKey) : null;
    const appShell = document.getElementById('app-shell');
    const authRoot = document.getElementById('auth-root');
    let data = emptyData;
    let authSession = null;
    let profile = null;
    let organization = null;
    let view = 'overview';
    let salesTab = 'All documents';
    let catalogTab = 'All products';
    let searchQuery = '';
    let roleView = 'customer';
    const page = document.getElementById('page');

    function renderBackendConfigMessage() {
      appShell.hidden = true;
      authRoot.hidden = false;
      authRoot.className = 'auth-screen';
      authRoot.innerHTML = `<section class="auth-card"><div class="auth-brand"><div class="brand-mark">${icons.product}</div><div><div class="brand-name">clearflow</div><div class="brand-caption">WATER SYSTEMS · OPERATIONS</div></div></div><div class="eyebrow" style="margin-top:24px">Backend setup required</div><h1>Connect your business workspace</h1><p>Sign-in and shared records are disabled until this app is connected to your Supabase project.</p><div class="notice"><strong>Next:</strong> create the database using <code>supabase/schema.sql</code>, then configure <code>VITE_SUPABASE_URL</code> and <code>VITE_SUPABASE_ANON_KEY</code> for your build.</div><p class="auth-footnote">The public anon key is protected by database row-level security. Never add a service-role key to this app.</p></section>`;
    }
    function renderAuth(mode = 'sign-in', message = '') {
      appShell.hidden = true;
      authRoot.hidden = false;
      authRoot.className = 'auth-screen';
      const creating = mode === 'sign-up';
      authRoot.innerHTML = `<section class="auth-card"><div class="auth-brand"><div class="brand-mark">${icons.product}</div><div><div class="brand-name">clearflow</div><div class="brand-caption">WATER SYSTEMS · OPERATIONS</div></div></div><h1>${creating ? 'Create your workspace' : 'Welcome back'}</h1><p>${creating ? 'Set up the owner account for your water business.' : 'Sign in to your water business workspace.'}</p>${message ? `<div class="auth-message" role="status">${esc(message)}</div>` : ''}<form class="auth-form" id="auth-form">${creating ? `<div class="field"><label for="auth-full-name">Your name</label><input id="auth-full-name" name="full_name" autocomplete="name" required maxlength="160"></div><div class="field"><label for="auth-phone">Phone number</label><input id="auth-phone" name="phone" type="tel" autocomplete="tel" required></div><div class="field"><label for="auth-organization">Business name</label><input id="auth-organization" name="organization_name" required maxlength="160"></div><div class="field"><label for="auth-gstin">Business GSTIN (optional)</label><input id="auth-gstin" name="gstin" maxlength="15" autocomplete="off"></div>` : ''}<div class="field"><label for="auth-email">Email</label><input id="auth-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="auth-password">Password</label><input id="auth-password" name="password" type="password" autocomplete="${creating ? 'new-password' : 'current-password'}" minlength="8" required></div><button class="button" type="submit">${creating ? 'Create account' : 'Sign in'}</button></form><button class="auth-switch" type="button" data-auth-mode="${creating ? 'sign-in' : 'sign-up'}">${creating ? 'Already have an account? Sign in' : 'Create the first owner account'}</button>${creating ? '' : '<button class="auth-switch" type="button" data-reset-password>Forgot password?</button>'}<p class="auth-footnote">Invited technicians, shops, and customers: open the invitation email from your business to set your password, then sign in here.</p></section>`;
      authRoot.querySelector('[data-auth-mode]').addEventListener('click', event => renderAuth(event.currentTarget.dataset.authMode));
      authRoot.querySelector('[data-reset-password]')?.addEventListener('click', () => renderPasswordResetRequest());
      authRoot.querySelector('#auth-form').addEventListener('submit', async event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.currentTarget).entries());
        const submit = event.currentTarget.querySelector('[type="submit"]');
        submit.disabled = true;
        try {
          if (creating) {
            const { data: result, error } = await supabaseClient.auth.signUp({
              email: values.email.trim(),
              password: values.password,
              options: { ...webRedirectOption('emailRedirectTo'), data: { full_name: values.full_name.trim(), phone: values.phone.trim(), organization_name: values.organization_name.trim(), gstin: values.gstin.trim() } }
            });
            if (error) throw error;
            if (result.session) await openAuthenticatedApp(result.session);
            else renderAuth('sign-in', 'Check your email to confirm the owner account, then sign in to finish workspace setup.');
          } else {
            const { data: result, error } = await supabaseClient.auth.signInWithPassword({ email: values.email.trim(), password: values.password });
            if (error) throw error;
            await openAuthenticatedApp(result.session);
          }
        } catch (error) {
          renderAuth(mode, error instanceof Error ? error.message : 'Sign-in failed. Check your details and try again.');
        }
      });
    }
    // Email links should return to the page they were requested from. In the Android app that page
    // is not reachable from an email link, so let Supabase fall back to its Site URL.
    function webRedirectOption(name) {
      return window.Capacitor?.isNativePlatform?.() ? {} : { [name]: window.location.origin + window.location.pathname };
    }
    function authBrand() {
      return `<div class="auth-brand"><div class="brand-mark">${icons.product}</div><div><div class="brand-name">clearflow</div><div class="brand-caption">WATER SYSTEMS · OPERATIONS</div></div></div>`;
    }
    function renderPasswordResetRequest(message = '') {
      appShell.hidden = true;
      authRoot.hidden = false;
      authRoot.className = 'auth-screen';
      authRoot.innerHTML = `<section class="auth-card">${authBrand()}<h1>Reset your password</h1><p>Enter your account email and we'll send you a link to choose a new password.</p>${message ? `<div class="auth-message" role="status">${esc(message)}</div>` : ''}<form class="auth-form" id="reset-form"><div class="field"><label for="reset-email">Email</label><input id="reset-email" name="email" type="email" autocomplete="email" required></div><button class="button" type="submit">Send reset link</button></form><button class="auth-switch" type="button" data-auth-mode="sign-in">Back to sign in</button></section>`;
      authRoot.querySelector('[data-auth-mode]').addEventListener('click', () => renderAuth('sign-in'));
      authRoot.querySelector('#reset-form').addEventListener('submit', async event => {
        event.preventDefault();
        const email = new FormData(event.currentTarget).get('email').trim();
        event.currentTarget.querySelector('[type="submit"]').disabled = true;
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, webRedirectOption('redirectTo'));
        if (error) { renderPasswordResetRequest(error.message); return; }
        renderAuth('sign-in', 'If that email has an account, a password reset link is on its way.');
      });
    }
    function renderSetPassword(session, linkType, message = '') {
      appShell.hidden = true;
      authRoot.hidden = false;
      authRoot.className = 'auth-screen';
      const invited = linkType === 'invite';
      authRoot.innerHTML = `<section class="auth-card">${authBrand()}<h1>${invited ? 'Set your password' : 'Choose a new password'}</h1><p>${invited ? `Welcome! Choose a password for <strong>${esc(session.user.email)}</strong>. You'll use it to sign in on this and other devices.` : `Choose a new password for <strong>${esc(session.user.email)}</strong>.`}</p>${message ? `<div class="auth-message" role="alert">${esc(message)}</div>` : ''}<form class="auth-form" id="password-form"><div class="field"><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm" type="password" autocomplete="new-password" minlength="8" required></div><button class="button" type="submit">Save password</button></form></section>`;
      authRoot.querySelector('#password-form').addEventListener('submit', async event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.currentTarget).entries());
        if (values.password !== values.confirm) { renderSetPassword(session, linkType, 'The passwords do not match.'); return; }
        event.currentTarget.querySelector('[type="submit"]').disabled = true;
        const { error } = await supabaseClient.auth.updateUser({ password: values.password });
        if (error) { renderSetPassword(session, linkType, error.message); return; }
        await openAuthenticatedApp(session);
      });
    }
    function renderOrganizationSetup(message = '') {
      authRoot.hidden = false;
      appShell.hidden = true;
      authRoot.className = 'auth-screen';
      const userMetadata = authSession.user.user_metadata || {};
      authRoot.innerHTML = `<section class="auth-card"><div class="auth-brand"><div class="brand-mark">${icons.product}</div><div><div class="brand-name">clearflow</div><div class="brand-caption">WATER SYSTEMS · OPERATIONS</div></div></div><h1>Finish business setup</h1><p>Confirm the legal details for your organization before adding customers or issuing invoices.</p>${message ? `<div class="auth-message" role="alert">${esc(message)}</div>` : ''}<form class="auth-form" id="organization-form"><div class="field"><label for="organization-name">Business name</label><input id="organization-name" name="name" required maxlength="160" value="${esc(userMetadata.organization_name || '')}"></div><div class="field"><label for="organization-gstin">GSTIN (optional)</label><input id="organization-gstin" name="gstin" maxlength="15" value="${esc(userMetadata.gstin || '')}"></div><button class="button" type="submit">Create workspace</button></form></section>`;
      authRoot.querySelector('#organization-form').addEventListener('submit', async event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.currentTarget).entries());
        const { error } = await supabaseClient.rpc('create_organization', { organization_name: values.name.trim(), organization_gstin: values.gstin.trim() || null });
        if (error) { renderOrganizationSetup(error.message); return; }
        await openAuthenticatedApp(authSession);
      });
    }
    async function openAuthenticatedApp(session) {
      authSession = session;
      const { data: profileData, error: profileError } = await supabaseClient
        .from('profiles')
        .select('user_id, organization_id, role, full_name, login_email, phone, business_name, business_address, gstin, customer_id, active')
        .eq('user_id', session.user.id)
        .single();
      if (profileError) { renderAuth('sign-in', `Profile setup is not ready yet: ${profileError.message}`); return; }
      profile = profileData;
      if (!profile.active) { renderAuth('sign-in', 'This account has been disabled. Contact your organization owner.'); return; }
      if (!profile.organization_id) { renderOrganizationSetup(); return; }

      try {
        const { data: org, error: organizationError } = await supabaseClient
          .from('organizations')
          .select('id, name, gstin')
          .eq('id', profile.organization_id)
          .single();
        if (organizationError) throw organizationError;
        organization = org;
        data = await loadWorkspace(supabaseClient, profile);
      } catch (error) {
        renderAuth('sign-in', error instanceof Error ? error.message : 'Workspace could not be loaded');
        return;
      }
      roleView = profile.role === 'owner' ? (localStorage.getItem('clearflow-role') || 'customer') : profile.role;
      document.getElementById('role-select').value = roleView;
      updateRoleControl();
      document.getElementById('user-name').textContent = profile.full_name || profile.login_email;
      document.getElementById('user-role').textContent = roleLabels[profile.role] || profile.role;
      document.getElementById('user-initials').textContent = initials(profile.full_name || profile.login_email);
      document.getElementById('signout-button').hidden = false;
      updateRoleAccess();
      authRoot.hidden = true;
      appShell.hidden = false;
      render();
      if (deleteAccountRequested) {
        deleteAccountRequested = false;
        window.history.replaceState(null, '', window.location.pathname);
        openAccountSettings();
      }
    }
    function updateRoleAccess() {
      const allowedViews = {
        owner: ['overview', 'customers', 'jobs', 'sales', 'catalog', 'accounts', 'feedback'],
        technician: ['overview', 'jobs', 'catalog', 'feedback'],
        shop: ['overview', 'catalog', 'feedback'],
        customer: ['overview', 'jobs', 'catalog', 'sales', 'feedback']
      }[profile?.role] || [];
      document.querySelectorAll('.nav-item[data-view]').forEach(button => { button.hidden = !allowedViews.includes(button.dataset.view); });
    }
    async function initializeApp() {
      if (!supabaseClient) { renderBackendConfigMessage(); return; }
      supabaseClient.auth.onAuthStateChange(event => {
        if (event === 'SIGNED_OUT') {
          authSession = null; profile = null; organization = null; data = emptyData;
          document.getElementById('signout-button').hidden = true;
          renderAuth('sign-in');
        }
      });
      const { data: sessionData, error } = await supabaseClient.auth.getSession();
      if (authLinkType || authLinkError) window.history.replaceState(null, '', window.location.pathname + window.location.search);
      if (authLinkError) { renderAuth('sign-in', `That email link could not be used: ${authLinkError}. Ask your business owner for a new invitation, or use "Forgot password?".`); return; }
      if (error) { renderAuth('sign-in', error.message); return; }
      if (sessionData.session && (authLinkType === 'invite' || authLinkType === 'recovery')) { renderSetPassword(sessionData.session, authLinkType); return; }
      if (sessionData.session) await openAuthenticatedApp(sessionData.session);
      else renderAuth('sign-in', deleteAccountRequested ? 'Sign in to delete your Clearflow account.' : '');
    }
    function esc(value = '') { return String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]); }
    function money(value) { return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(Number(value) || 0); }
    function date(value) { if (!value) return '—'; return new Intl.DateTimeFormat('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date(`${value}T00:00:00`)); }
    function shortDate(value) { if (!value) return '—'; return new Intl.DateTimeFormat('en-IN', { day: '2-digit', month: 'short' }).format(new Date(`${value}T00:00:00`)); }
    function customer(id) { return data.customers.find(item => item.id === id) || { name: 'Unknown customer', phone: '', address: '' }; }
    function product(id) { return data.products.find(item => item.id === id) || { name: 'Removed product', gst: 18 }; }
    function price(productItem, role = roleView) { return productItem[role] ?? productItem.customer ?? 0; }
    function initials(name = '') { return name.split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase(); }
    function setView(next) {
      const target = document.querySelector(`.nav-item[data-view="${next}"]`);
      if (!target || target.hidden) return;

      if (profile.role !== 'owner') { toast('Only the owner can manage customer records'); return; }
      const item = existing || {};
      showModal(existing ? 'Edit customer' : 'Add customer', 'Contact, address and installation details', `<div class="form-grid"><div class="field"><label for="name">Customer / business name *</label><input id="name" name="name" required value="${esc(item.name || '')}"></div><div class="field"><label for="phone">Phone number *</label><input id="phone" name="phone" type="tel" required value="${esc(item.phone || '')}"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="${esc(item.email || '')}"></div><div class="field"><label for="type">Customer type</label><select id="type" name="type"><option ${item.type === 'Residential' ? 'selected' : ''}>Residential</option><option ${item.type === 'Commercial' ? 'selected' : ''}>Commercial</option><option ${item.type === 'Apartment' ? 'selected' : ''}>Apartment</option></select></div><div class="field full"><label for="address">Full address</label><textarea id="address" name="address">${esc(item.address || '')}</textarea></div><div class="field"><label for="purifier">Purifier / model installed</label><input id="purifier" name="purifier" value="${esc(item.purifier || '')}"></div><div class="field"><label for="installed">Installation date</label><input id="installed" name="installed" type="date" value="${esc(item.installed || '')}"></div></div>`, existing ? 'Save changes' : 'Add customer', async form => {
        const value = Object.fromEntries(form.entries());
        const next = { ...item, ...value, id: existing?.id || `C-${crypto.randomUUID().slice(0, 8).toUpperCase()}`, notes: item.notes || '' };
        await save('customers', [next]);
        if (existing) Object.assign(existing, next); else data.customers.unshift(next);
        closeModal(); render(); toast(existing ? 'Customer updated' : 'Customer added');
      });
    }
    function openJobForm(existing) {
      if (!data.customers.length) { toast('Add a customer before scheduling a service job'); return; }
      if (profile.role !== 'owner' && (profile.role !== 'technician' || !existing)) { toast('Only an owner can schedule a service job'); return; }
      const item = existing || {};
      const technicianMode = profile.role === 'technician';
      const formBody = technicianMode
        ? `<div class="form-grid"><div class="field"><label>Customer</label><input value="${esc(customer(item.customerId).name)}" disabled></div><div class="field"><label>Service type</label><input value="${esc(item.type)}" disabled></div><div class="field full"><label for="status">Update status</label><select name="status" id="status"><option ${item.status === 'In progress' ? 'selected' : ''}>In progress</option><option ${item.status === 'Completed' ? 'selected' : ''}>Completed</option></select></div><div class="field full"><label for="notes">Service notes</label><textarea id="notes" name="notes">${esc(item.notes || '')}</textarea></div></div>`
        : `<div class="form-grid"><div class="field full"><label for="customerId">Customer *</label><select id="customerId" name="customerId" required>${customerOptions(item.customerId)}</select></div><div class="field"><label for="type">Service type *</label><select id="type" name="type" required>${['Installation', 'Filter replacement', 'Routine maintenance', 'Quarterly maintenance', 'Low water flow', 'Repair', 'Other'].map(type => `<option ${item.type === type ? 'selected' : ''}>${type}</option>`).join('')}</select></div><div class="field"><label for="date">Visit date *</label><input id="date" name="date" type="date" required value="${esc(item.date || new Date().toISOString().slice(0, 10))}"></div><div class="field"><label for="technician">Technician</label><input id="technician" name="technician" list="technician-list" value="${esc(item.technician || '')}"><datalist id="technician-list">${data.accounts.filter(account => account.role === 'Technician').map(account => `<option value="${esc(account.name)}"></option>`).join('')}</datalist></div><div class="field"><label for="status">Status</label><select name="status" id="status">${['Scheduled', 'In progress', 'Completed', 'Cancelled'].map(status => `<option ${item.status === status ? 'selected' : ''}>${status}</option>`).join('')}</select></div><div class="field full"><label for="notes">Job notes</label><textarea id="notes" name="notes">${esc(item.notes || '')}</textarea></div></div>`;
      showModal(technicianMode ? 'Update service job' : existing ? 'Edit service job' : 'Schedule service', 'Installation, maintenance and repair visits', formBody, technicianMode ? 'Save update' : existing ? 'Save changes' : 'Schedule job', async form => {
        const value = Object.fromEntries(form.entries());
        if (technicianMode) {
          const { error } = await supabaseClient.rpc('set_service_job_status', { job_id: existing.id, next_status: value.status, job_notes: value.notes || null });
          if (error) throw error;
          Object.assign(existing, { status: value.status, notes: value.notes });
        } else {
          const next = { ...item, ...value, id: existing?.id || `SR-${crypto.randomUUID().slice(0, 8).toUpperCase()}` };
          await save('jobs', [next]);
          if (existing) Object.assign(existing, next); else data.jobs.unshift(next);
        }
        closeModal(); render(); toast(technicianMode ? 'Service update saved' : existing ? 'Service job updated' : 'Service job scheduled');
      });
    }
    function openAccountForm(existing) {
      if (profile.role !== 'owner') { toast('Only the organization owner can manage accounts'); return; }
      const item = existing || {};
      const roles = existing ? ['Technician', 'Shop', 'Customer', 'Owner'] : ['Technician', 'Shop', 'Customer'];
      showModal(existing ? 'Edit account' : 'Invite account', 'Supabase sends a secure sign-in invitation to the email address.', `<div class="form-grid"><div class="field"><label for="name">Name / business *</label><input id="name" name="name" required value="${esc(item.name || '')}"></div><div class="field"><label for="username">Login email *</label><input id="username" name="username" type="email" required value="${esc(item.username || '')}" ${existing ? 'readonly' : ''}></div><div class="field"><label for="role">Access role</label><select id="role" name="role">${roles.map(role => `<option ${item.role === role ? 'selected' : ''}>${role}</option>`).join('')}</select></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" value="${esc(item.phone || '')}"></div><div class="field full"><label for="address">Shop / business address</label><input id="address" name="address" value="${esc(item.address || '')}"></div><div class="field"><label for="gstin">GSTIN</label><input id="gstin" name="gstin" maxlength="15" value="${esc(item.gstin || '')}"></div><div class="field"><label for="linked">Linked customer record ID</label><select id="linked" name="linked"><option value="">Not linked</option>${data.customers.map(customerItem => `<option value="${esc(customerItem.id)}" ${item.linked === customerItem.id ? 'selected' : ''}>${esc(customerItem.name)} · ${esc(customerItem.id)}</option>`).join('')}</select></div><div class="field"><label for="status">Account status</label><select id="status" name="status"><option ${item.status !== 'Inactive' ? 'selected' : ''}>Active</option><option ${item.status === 'Inactive' ? 'selected' : ''}>Inactive</option></select></div></div><p style="margin:13px 0 0;color:#63776c;font-size:11px">Users set their own password through Supabase’s email invitation. Passwords are never stored here.</p>`, existing ? 'Save changes' : 'Send invitation', async form => {
        const value = Object.fromEntries(form.entries());
        if (existing) {
          const { error } = await supabaseClient.from('profiles').update({
            full_name: value.name.trim(),
            phone: value.phone.trim(),
            role: value.role.toLowerCase(),
            business_name: value.role === 'Shop' ? value.name.trim() : '',
            business_address: value.address.trim(),
            gstin: value.gstin.trim(),
            customer_id: value.role === 'Customer' ? value.linked || null : null,
            active: value.status === 'Active'
          }).eq('user_id', existing.id).eq('organization_id', profile.organization_id);
          if (error) throw error;
        } else {
          await inviteMember(supabaseClient, { ...value, email: value.username });
        }
        data = await loadWorkspace(supabaseClient, profile);
        closeModal(); render(); toast(existing ? 'Account updated' : 'Invitation sent');
      });
    }
    function openFeedbackForm() {
      showModal('Submit feedback', 'Tell us about your experience or something that needs attention', `<div class="form-grid"><div class="field"><label for="type">What would you like to share? *</label><select id="type" name="type" required><option>Customer feedback</option><option>Issue</option><option>Bug</option><option>Feature request</option></select></div><div class="field"><label for="priority">Priority</label><select id="priority" name="priority"><option>Normal</option><option>High</option><option>Urgent</option></select></div><div class="field"><label for="name">Your name</label><input id="name" name="name" value="${esc(profile.full_name)}" readonly></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" value="${esc(profile.phone)}" readonly></div><div class="field"><label for="email">Account email</label><input id="email" name="email" value="${esc(profile.login_email)}" readonly></div><div class="field"><label for="reference">Product, job or invoice reference</label><input id="reference" name="reference" placeholder="Optional"></div><div class="field full"><label for="title">Subject *</label><input id="title" name="title" required maxlength="100"></div><div class="field full"><label for="description">Details *</label><textarea id="description" name="description" required maxlength="2000"></textarea></div></div>`, 'Send feedback', async form => {
        const values = Object.fromEntries(form.entries());
        const entry = { ...values, customerId: profile.customer_id || '', id: `FB-${crypto.randomUUID().slice(0, 8).toUpperCase()}`, date: new Date().toISOString().slice(0, 10), createdAt: new Date().toISOString(), status: 'New' };
        await save('feedback', [entry]);
        data.feedback.unshift(entry);
        closeModal(); render(); toast('Feedback submitted');
      }, true);
    }
    function openMoreMenu() {
      const tools = [
        ['catalog', 'Product catalogue', icons.product],
        ['accounts', 'Accounts & access', icons.person],
        ['feedback', 'Feedback & issues', icons.service]
      ].filter(([target]) => ({ owner: ['catalog', 'accounts', 'feedback'], technician: ['catalog', 'feedback'], shop: ['catalog', 'feedback'], customer: ['catalog', 'feedback'] }[profile.role] || []).includes(target));
      const body = `<div class="quick-grid">${tools.map(([target, label, icon]) => `<button class="quick-action" type="button" data-nav="${target}">${icon}<span>${label}</span></button>`).join('')}<button class="quick-action" type="button" data-action="my-account">${icons.person}<span>My account</span></button></div>`;
      showModal('More tools', 'Products, team access, and customer feedback', body, 'Done', closeModal);
    }
    function openAccountSettings() {
      const businessName = esc(organization?.name || 'your business');
      const consequence = profile.role === 'owner'
        ? `If you are the only owner, this permanently deletes the <strong>${businessName}</strong> workspace: every customer, service job, product, invoice and feedback item, and the login of every technician, shop and customer you invited. This cannot be undone.`
        : `This permanently deletes your login and the feedback you submitted. This cannot be undone. <strong>${businessName}</strong> keeps the records it needs for service history and GST invoices; contact them directly if you want those removed.`;
      showModal('My account', `${profile.login_email} · ${roleLabels[profile.role] || profile.role}`, `<div class="notice"><strong>Delete account.</strong> ${consequence}</div><div class="field"><label for="delete-confirm">Type DELETE to confirm</label><input id="delete-confirm" name="confirm" autocomplete="off" required></div>`, 'Delete account', async form => {
        if (form.get('confirm').trim() !== 'DELETE') throw new Error('Type DELETE to confirm');
        await deleteAccount(supabaseClient);
        closeModal();
        await supabaseClient.auth.signOut({ scope: 'local' });
        renderAuth('sign-in', 'Your account has been deleted.');
      });
      document.querySelector('#active-form [type="submit"]').classList.add('danger');
    }
    function openProductForm() {
      if (profile.role !== 'owner') { toast('Only the owner can change catalogue items'); return; }
      showModal('Add catalogue item', 'Set customer, technician and shop pricing', `<div class="form-grid"><div class="field"><label for="name">Product name *</label><input id="name" name="name" required></div><div class="field"><label for="category">Category</label><select id="category" name="category"><option>Purifiers</option><option>Accessories</option><option>Spare parts</option></select></div><div class="field full"><label for="description">Description</label><input id="description" name="description"></div><div class="field"><label for="customer">Customer price (₹)</label><input id="customer" name="customer" type="number" min="0" required></div><div class="field"><label for="technician">Technician price (₹)</label><input id="technician" name="technician" type="number" min="0" required></div><div class="field"><label for="shop">Shop price (₹)</label><input id="shop" name="shop" type="number" min="0" required></div><div class="field"><label for="stock">Stock quantity</label><input id="stock" name="stock" type="number" min="0" value="0"></div><div class="field"><label for="gst">GST rate (%)</label><input id="gst" name="gst" type="number" min="0" max="100" value="18"></div></div>`, 'Add product', async form => {
        const value = Object.fromEntries(form.entries());
        const item = { ...value, id: `P-${crypto.randomUUID().slice(0, 8).toUpperCase()}`, customer: Number(value.customer), technician: Number(value.technician), shop: Number(value.shop), stock: Number(value.stock), gst: Number(value.gst) };
        await save('products', [item]);
        data.products.push(item);
        closeModal(); render(); toast('Product added to catalogue');
      });
    }
    function openSaleForm(type = 'Quotation') {
      if (profile.role !== 'owner') { toast('Only the owner can create quotations or invoices'); return; }
      if (!data.customers.length || !data.products.length) { toast('Add a customer and product before creating a document'); return; }
      const options = data.products.map(item => `<option value="${esc(item.id)}" data-price="${price(item)}">${esc(item.name)} · ${money(price(item))}</option>`).join('');
      showModal(`New ${type.toLowerCase()}`, 'Choose a customer, products and GST treatment', `<div class="form-grid"><div class="field"><label for="docType">Document type</label><select id="docType" name="docType"><option ${type === 'Quotation' ? 'selected' : ''}>Quotation</option><option ${type === 'Invoice' ? 'selected' : ''}>Invoice</option></select></div><div class="field"><label for="customerId">Customer *</label><select id="customerId" name="customerId" required>${customerOptions()}</select></div><div class="field"><label for="date">Document date</label><input id="date" name="date" type="date" required value="${new Date().toISOString().slice(0, 10)}"></div><div class="field"><label for="due">Valid until / due date</label><input id="due" name="due" type="date" value="${new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10)}"></div><div class="field full"><label>Line items</label><div id="line-items"><div class="line-item"><div class="field"><label>Product</label><select name="productId" class="sale-product">${options}</select></div><div class="field"><label>Qty</label><input name="qty" class="sale-qty" type="number" min="1" value="1" required></div><div class="field"><label>Unit price ₹</label><input name="price" class="sale-price" type="number" min="0" value="${price(data.products[0])}" required></div><button class="row-action remove-line" type="button" aria-label="Remove line">${icons.close}</button></div></div><button class="button secondary" id="add-line" type="button">${icons.plus} Add line item</button></div><div class="field full"><label class="price-toggle"><input type="checkbox" name="gst" id="gst-check" checked> Apply GST at each product’s rate</label></div><div class="field full"><div class="invoice-total" id="sale-total"></div></div></div>`, 'Save document', async (values, form) => {
        const ids = form.querySelectorAll('.sale-product');
        const quantities = form.querySelectorAll('.sale-qty');
        const prices = form.querySelectorAll('.sale-price');
        const items = [...ids].map((select, index) => ({ productId: select.value, qty: Number(quantities[index].value), price: Number(prices[index].value) }));
        if (items.some(item => item.qty < 1 || item.price < 0)) { toast('Check item quantities and prices'); return; }
        const document = { type: values.get('docType'), customerId: values.get('customerId'), date: values.get('date'), due: values.get('due'), items, gst: values.has('gst') };
        await createSalesDocument(supabaseClient, document);
        data = await loadWorkspace(supabaseClient, profile);
        closeModal(); render(); toast(`${document.type} saved`);
      }, true);
      const modal = document.getElementById('modal-root');
      const updateTotal = () => {
        const rows = [...modal.querySelectorAll('.line-item')];
        const subtotal = rows.reduce((sum, row) => sum + Number(row.querySelector('.sale-qty').value || 0) * Number(row.querySelector('.sale-price').value || 0), 0);
        const gst = modal.querySelector('#gst-check').checked ? rows.reduce((sum, row) => { const selected = product(row.querySelector('.sale-product').value); return sum + Number(row.querySelector('.sale-qty').value || 0) * Number(row.querySelector('.sale-price').value || 0) * Number(selected.gst || 18) / 100; }, 0) : 0;
        modal.querySelector('#sale-total').innerHTML = `<div><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div><span>GST ${gst ? '(product rates)' : '(not applied)'}</span><strong>${money(gst)}</strong></div><div class="grand"><span>Total</span><strong>${money(subtotal + gst)}</strong></div>`;
      };
      const bindRow = row => {
        row.querySelector('.sale-product').addEventListener('change', event => { row.querySelector('.sale-price').value = price(product(event.target.value)); updateTotal(); });
        row.querySelectorAll('input').forEach(input => input.addEventListener('input', updateTotal));
        row.querySelector('.remove-line').addEventListener('click', () => { if (modal.querySelectorAll('.line-item').length > 1) { row.remove(); updateTotal(); } });
      };
      bindRow(modal.querySelector('.line-item'));
      modal.querySelector('#gst-check').addEventListener('change', updateTotal);
      modal.querySelector('#add-line').addEventListener('click', () => { const row = document.createElement('div'); row.className = 'line-item'; row.innerHTML = `<div class="field"><label>Product</label><select name="productId" class="sale-product">${options}</select></div><div class="field"><label>Qty</label><input name="qty" class="sale-qty" type="number" min="1" value="1" required></div><div class="field"><label>Unit price ₹</label><input name="price" class="sale-price" type="number" min="0" value="${price(data.products[0])}" required></div><button class="row-action remove-line" type="button" aria-label="Remove line">${icons.close}</button>`; modal.querySelector('#line-items').append(row); bindRow(row); updateTotal(); });
      updateTotal();
    }
    function printDocument(id) {
      const doc = data.documents.find(item => item.id === id);
      if (!doc) return;
      const person = customer(doc.customerId);
      const amounts = totals(doc);
      const rows = doc.items.map(item => `<tr><td>${esc(product(item.productId).name)}</td><td>${item.qty}</td><td>${money(item.price)}</td><td>${money(item.qty * item.price)}</td></tr>`).join('');
      const print = window.open('', '_blank', 'width=800,height=700');
      if (!print) { toast('Allow pop-ups to print this document'); return; }
      print.document.write(`<!doctype html><html><head><title>${esc(doc.id)}</title><style>body{font:14px Arial,sans-serif;color:#24342d;padding:48px}h1{color:#197c70}small{color:#68756e}table{width:100%;border-collapse:collapse;margin-top:30px}th,td{text-align:left;padding:12px;border-bottom:1px solid #ddd}th{background:#f4f7f4}.total{width:280px;margin:24px 0 0 auto}.total p{display:flex;justify-content:space-between}.grand{border-top:1px solid #aaa;padding-top:12px;font-size:18px;font-weight:bold}.foot{margin-top:60px;color:#77827c;font-size:12px}</style></head><body><h1>clearflow</h1><small>WATER SYSTEMS</small><h2>${esc(doc.type)} · ${esc(doc.id)}</h2><p>${esc(person.name)}<br>${esc(person.phone)}<br>${esc(person.address)}</p><p>Date: ${date(doc.date)}<br>${doc.type === 'Quotation' ? 'Valid until' : 'Due date'}: ${date(doc.due)}<br>Tax: ${doc.gst ? 'GST applied at product rates' : 'No GST'}</p><table><thead><tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table><div class="total"><p><span>Subtotal</span><strong>${money(amounts.subtotal)}</strong></p><p><span>GST</span><strong>${money(amounts.gst)}</strong></p><p class="grand"><span>Total</span><strong>${money(amounts.grand)}</strong></p></div><div class="foot">Thank you for choosing Clearflow Water Systems.</div><script>window.onload=()=>window.print()<\/script></body></html>`);
      print.document.close();
    }
    document.querySelectorAll('.nav-item[data-view]').forEach(button => button.addEventListener('click', () => setView(button.dataset.view)));
    document.getElementById('role-select').value = roleView;
    document.getElementById('role-select').addEventListener('change', event => {
      if (profile?.role !== 'owner') { event.target.value = profile?.role || 'customer'; return; }
      roleView = event.target.value;
      localStorage.setItem('clearflow-role', roleView);
      render();
    });
    document.getElementById('signout-button').addEventListener('click', async () => {
      const { error } = await supabaseClient.auth.signOut();
      if (error) toast(error.message);
    });
    document.getElementById('help-button').addEventListener('click', () => toast('Use Accounts & access to manage role and price access.'));
    document.addEventListener('click', event => {
      const action = event.target.closest('[data-action]')?.dataset.action;
      if (action === 'new-customer') openCustomerForm();
      if (action === 'new-job') openJobForm();
      if (action === 'new-sale') openSaleForm();
      if (action === 'new-product') openProductForm();
      if (action === 'new-account') openAccountForm();
      if (action === 'submit-feedback') openFeedbackForm();
      if (action === 'more-menu') openMoreMenu();
      if (action === 'my-account') openAccountSettings();
      const nav = event.target.closest('[data-nav]')?.dataset.nav;
      if (nav) { closeModal(); setView(nav); }
      const customerEdit = event.target.closest('[data-edit-customer]')?.dataset.editCustomer;
      if (customerEdit) openCustomerForm(data.customers.find(item => item.id === customerEdit));
      const jobEdit = event.target.closest('[data-edit-job]')?.dataset.editJob;
      if (jobEdit) openJobForm(data.jobs.find(item => item.id === jobEdit));
      const accountEdit = event.target.closest('[data-edit-account]')?.dataset.editAccount;
      if (accountEdit) openAccountForm(data.accounts.find(item => item.id === accountEdit));
      const printId = event.target.closest('[data-print-doc]')?.dataset.printDoc;
      if (printId) printDocument(printId);
      const sales = event.target.closest('[data-sales-tab]')?.dataset.salesTab;
      if (sales) { salesTab = sales; renderSales(); }
      const catalog = event.target.closest('[data-catalog-tab]')?.dataset.catalogTab;
      if (catalog) { catalogTab = catalog; renderCatalog(); }
    });
    document.addEventListener('change', async event => {
      const statusSelect = event.target.closest('[data-feedback-status]');
      if (!statusSelect) return;
      const entry = data.feedback.find(item => item.id === statusSelect.dataset.feedbackStatus);
      if (!entry) return;
      if (profile.role !== 'owner') { statusSelect.value = entry.status; return; }
      try {
        await setFeedbackStatus(supabaseClient, entry.id, statusSelect.value);
        entry.status = statusSelect.value;
        toast('Feedback status updated');
      } catch (error) {
        statusSelect.value = entry.status;
        toast(error instanceof Error ? error.message : 'Could not update feedback status');
      }
    });
    initializeApp();
  </script>
</body>
</html>
