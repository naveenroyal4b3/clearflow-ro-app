project_id = "clearflow-ro-app"

[functions.invite-member]
# The gateway's legacy JWT check does not support the project's new API keys/JWT signing keys.
# The function verifies the caller itself with auth.getUser() and rejects unauthenticated requests.
verify_jwt = false

[functions.delete-account]
# Same as invite-member: the function verifies the caller with auth.getUser().
verify_jwt = false
